@if (user$ | async; as user)
{

@if (!showForm)
{
<mat-card>
    <mat-card-header> User Details</mat-card-header>
    <mat-card-content>
        <p>{{user.name}}</p>
        <p>{{user.email}}</p>
        <p>{{user.phonenumber}}</p>
        <p>{{user.dob | date : 'dd/MM/yyyy'}}</p>

        <p>Tags</p>
        <ol>
            @for (tag of user.tags; track $index)
            {
            <li>{{tag}}</li>
            }
        </ol>
    </mat-card-content>
    <mat-card-actions>
        <button mat-flat-button color="error" type="button" (click)="deleteUser()">Delete </button>

        <button mat-raised-button type="button" (click)="editUser()">Edit User </button>
    </mat-card-actions>
</mat-card>
}
@else{
<app-test-form [user]=user> </app-test-form>
<mat-card>
    <mat-card-actions>
        <button mat-raised-button type="button" (click)="cancelEdit()">Cancel changes and close form </button>
    </mat-card-actions>
</mat-card>
}

}
