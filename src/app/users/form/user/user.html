<form [formGroup]="form" (ngSubmit)="onSubmit()" class="user-form">
  <label for="name">Name: </label>
  <input id="name" type="text" formControlName="name" />

  <label>
    Phone Number:
    <input type="tel" formControlName="phonenumber" id="phonenumber" />
    @if(form.controls.phonenumber.invalid && form.controls.phonenumber.touched) {
    <span class="error">Valid phone number required</span>
    }
  </label>

  <label>
    Email:
    <input type="email" formControlName="email" id="email" />
    @if(form.controls.email.invalid && form.controls.email.touched) {
    <span class="error">Valid email required</span>
    }
  </label>

  <label>
    Date of Birth (optional):
    <input type="date" formControlName="dob" id="dob" />
  </label>

  <button type="submit" [disabled]="form.invalid || loading()">Submit</button>
</form>

@if(success()){
<div>Data saved successfully!</div>}
@else if (error()) {
<div>Error: {{ error() }}</div>}

<p>Form Status: {{ form.status }}</p>

{{name?.value}}
{{dob?.value}}
